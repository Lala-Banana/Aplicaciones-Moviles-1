<ion-menu contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Menú</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <ion-list>
      <!-- Botón para Perfil -->
      <ion-item (click)="goToPage('perfil')">
        <ion-icon name="person" slot="start"></ion-icon>
        <ion-label>Perfil</ion-label>
      </ion-item>

      <!-- Botón para Vehiculo -->
      <ion-item (click)="goToPage('listar-vehiculo')">
        <ion-icon name="car" slot="start"></ion-icon>
        <ion-label>Vehículos</ion-label>
      </ion-item>

      <!-- Botón para Viaje -->
      <ion-item (click)="goToPage('lista-viajes')">
        <ion-icon name="briefcase" slot="start"></ion-icon>
        <ion-label>Viaje</ion-label>
      </ion-item>

      <!-- Botón para Cerrar Sesión -->
      <ion-item (click)="logout()">
        <ion-icon name="log-out" slot="start"></ion-icon>
        <ion-label>Cerrar Sesión</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<!-- Página inicio -->
<div class="ion-page" id="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <ion-title>Inicio</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding">
    <div #contenido>
      <ion-card>
        <ion-card-content>
          <div id="opciones">
            <div class="op1" (click)="goToPage('lista-viajes')">
              <img alt="Silhouette of mountains" src="https://ionicframework.com/docs/img/demos/card-media.png" />
              <ion-card-header>
                <ion-card-title>Card Title</ion-card-title>
                <ion-card-subtitle>Card Subtitle</ion-card-subtitle>
              </ion-card-header>
              <ion-card-content>
                Here's a small text description for the card content. Nothing more, nothing less.
              </ion-card-content>
            </div>

            <div class="op1">
              <img alt="Silhouette of mountains" src="https://ionicframework.com/docs/img/demos/card-media.png" />
              <ion-card-header>
                <ion-card-title>Card Title</ion-card-title>
                <ion-card-subtitle>Card Subtitle</ion-card-subtitle>
              </ion-card-header>
              <ion-card-content>
                Here's a small text description for the card content. Nothing more, nothing less.
              </ion-card-content>
            </div>
          </div>
        </ion-card-content>
      </ion-card>

      <ion-button (click)="play()">Play</ion-button>
      <ion-button (click)="pause()">Pause</ion-button>
      <ion-button (click)="stop()">Stop</ion-button>
    </div>
  </ion-content>
</div>
