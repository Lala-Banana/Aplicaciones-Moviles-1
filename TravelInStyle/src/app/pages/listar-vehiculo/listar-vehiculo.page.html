<!-- Menú deslizable -->
<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goToPage('perfil')" fill="clear">
        <ion-icon name="person"></ion-icon>
      </ion-button>
      
      <ion-button (click)="goToPage('lista-viajes')" fill="clear">
        <ion-icon name="briefcase"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>listarVehiculo</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()" fill="clear">
        <ion-icon name="log-out"></ion-icon>
      </ion-button>
      <ion-back-button defaultHref="/"></ion-back-button> <!-- Botón de regreso -->
    </ion-buttons>
  </ion-toolbar>
</ion-header>


<!-- Encabezado con botón de menú y de regreso -->
<div class="ion-page" id="main-content">
  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button> <!-- Botón para abrir el menú -->
      </ion-buttons>
      <ion-title>listarVehiculo</ion-title>
      <ion-buttons slot="end">
        <ion-back-button defaultHref="/"></ion-back-button> <!-- Botón de regreso -->
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <!-- Contenido principal -->
  <ion-content [fullscreen]="true">
    <ion-header collapse="condense">
      <ion-toolbar>
        <ion-title size="large">listarVehiculo</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-list>
      <ion-item *ngFor="let vehiculo of vehiculos">
        <ion-label>
          <div class="box">
            <ion-img [src]="vehiculo.imagen_vehiculo" ></ion-img>
          </div>
          <p><strong>Marca:</strong> {{ vehiculo.marca }}</p>
          <p><strong>Modelo:</strong> {{ vehiculo.modelo }}</p>
          <p><strong>Patente:</strong> {{ vehiculo.patente }}</p>
        </ion-label>
      </ion-item>
    </ion-list>

    <!-- Botón flotante para agregar vehículo -->
    <ion-fab vertical="bottom" horizontal="end" slot="fixed">
      <ion-fab-button (click)="agregarVehiculo()">
        <ion-icon name="add"></ion-icon>
      </ion-fab-button>
    </ion-fab>
  </ion-content>
</div>
