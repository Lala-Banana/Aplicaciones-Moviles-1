<!-- Menú deslizable -->
<ion-menu contentId="main-content" >
  <ion-header>
    <ion-toolbar>
      <ion-title>Menú</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <ion-list>
      <!-- Botón para Perfil -->
      <ion-item (click)="goToPage('perfil')">
        <ion-icon name="person" slot="start"></ion-icon>
        <ion-label>Perfil</ion-label>
      </ion-item>

      <!-- Botón para Vehículo -->
      <ion-item (click)="goToPage('listar-vehiculo')">
        <ion-icon name="car" slot="start"></ion-icon>
        <ion-label>Vehículos</ion-label>
      </ion-item>

      <!-- Botón para Viaje -->
      <ion-item (click)="goToPage('lista-viajes')">
        <ion-icon name="briefcase" slot="start"></ion-icon>
        <ion-label>Viaje</ion-label>
      </ion-item>

      <!-- Botón para Cerrar Sesión -->
      <ion-item (click)="logout()">
        <ion-icon name="log-out" slot="start"></ion-icon>
        <ion-label>Cerrar Sesión</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>
<!-- FIN del Menú -->

<!-- Encabezado con botón de menú y de regreso -->
<div class="ion-page" id="main-content">
  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button> <!-- Botón para abrir el menú -->
      </ion-buttons>
      <ion-title>listarVehiculo</ion-title>
      <ion-buttons slot="end">
        <ion-back-button defaultHref="/"></ion-back-button> <!-- Botón de regreso -->
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <!-- Contenido principal -->
  <ion-content [fullscreen]="true">
    <ion-header collapse="condense">
      <ion-toolbar>
        <ion-title size="large">listarVehiculo</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-list>
      <ion-item *ngFor="let vehiculo of vehiculos">
        <ion-label>
          <p><strong>Marca:</strong> {{ vehiculo.marca }}</p>
          <p><strong>Modelo:</strong> {{ vehiculo.modelo }}</p>
          <p><strong>Patente:</strong> {{ vehiculo.patente }}</p>
        </ion-label>
      </ion-item>
    </ion-list>

    <!-- Botón flotante para agregar vehículo -->
    <ion-fab vertical="bottom" horizontal="end" slot="fixed">
      <ion-fab-button (click)="agregarVehiculo()">
        <ion-icon name="add"></ion-icon>
      </ion-fab-button>
    </ion-fab>
  </ion-content>
</div>
