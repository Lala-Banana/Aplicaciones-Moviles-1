<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button> <!-- Botón para abrir el menú -->
    </ion-buttons>
    <ion-title>Viaje</ion-title>
    <ion-buttons slot="end">
      <ion-back-button defaultHref="/"></ion-back-button> <!-- Botón de regreso -->
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" id="main-content">
  <ion-item>
    <ion-label position="floating">Costo</ion-label>
    <ion-input type="number" [(ngModel)]="nuevoViaje.costo" placeholder="Introduce el costo"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Fecha</ion-label>
    <ion-input type="date" [(ngModel)]="nuevoViaje.fecha" placeholder="Selecciona la fecha"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Ubicación Origen</ion-label>
    <ion-input [(ngModel)]="nuevoViaje.ubicacion_origen" placeholder="Introduce la ubicación de origen"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Ubicación Destino</ion-label>
    <ion-input [(ngModel)]="nuevoViaje.ubicacion_destino" placeholder="Introduce la ubicación de destino"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label>Selecciona un Vehículo</ion-label>
    <ion-select [(ngModel)]="vehiculoSeleccionado" (ionChange)="onVehiculoChange()">
      <ion-select-option *ngFor="let vehiculo of vehiculos" [value]="vehiculo.id">
        {{ vehiculo.marca }} - {{ vehiculo.modelo }} - {{ vehiculo.patente }}
      </ion-select-option>
    </ion-select>
  </ion-item>

  <ion-button expand="full" (click)="agregarViaje()">Agregar Viaje</ion-button>
</ion-content>
